root /srv/www/revenge-web/current;
index index.html;
charset utf-8;
server_tokens off;
sendfile on;
etag on;
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
location ~ /\. { deny all; }
location ~ ^/(source|reports|tools|deploy|dist)(/|$) { return 404; }
location ~* \.(html|css|js|xml|txt)$ {
    expires -1;
    try_files $uri =404;
}
location /assets/ {
    expires 7d;
    try_files $uri =404;
}
location / {
    expires -1;
    try_files $uri $uri/ =404;
}

access_log /var/log/nginx/revenge-web.access.log;
error_log /var/log/nginx/revenge-web.error.log;
