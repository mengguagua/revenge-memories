server {
    listen 80;
    listen [::]:80;
    server_name revenge-web.gaocc.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://revenge-web.gaocc.cc$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name revenge-web.gaocc.cc;
    ssl_certificate /etc/letsencrypt/live/revenge-web.gaocc.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revenge-web.gaocc.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RevengeWebTLS:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/snippets/revenge-web-common.conf;
}
