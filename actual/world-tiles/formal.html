<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正式世界地图 · 39据点</title>
<style>body{margin:0;background:#15232b;color:#e6e3d3;font:16px/1.6 system-ui}header{padding:24px 32px}h1{font-size:26px;margin:0 0 8px}p{margin:8px 0}a{color:#c8d8e2}main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;padding:0 24px 32px}.map{overflow:auto;background:#1b2b35;border-radius:12px;padding:16px}canvas{display:block;image-rendering:pixelated}aside{padding:16px;background:#20323b;border-radius:12px}button{font:inherit;color:inherit;background:#2b414b;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;width:100%;margin:4px 0;text-align:left}button:focus-visible,button.active{outline:0;background:#40545a;box-shadow:0 0 14px #b8caad55}small{color:#bcc8c7}#detail{padding:8px 0 20px;min-height:160px}#nodes{max-height:620px;overflow:auto}#detail h2{font-size:20px}footer{padding:24px 32px}@media(max-width:900px){main{grid-template-columns:1fr}#nodes{max-height:300px}}</style>
<header><h1>正式世界地图</h1><p>39 个据点 · 40 条路线 · 56×64 格。按剧情索引拼接，地图显示与游戏行进共用路线格。</p><a href="../reports/campaign/screenshots/index.html">实机截图</a> · <a href="../data/formal_world.json">地图数据</a> · <a href="../assets/battle_tiles/README.md">战斗素材说明</a></header>
<main><div class="map"><canvas id="map" width="896" height="1024"></canvas></div><aside><div id="detail">正在加载图集…</div><div id="nodes"></div></aside></main>
<footer>点击地图或列表查看地点及连接条件。原生16像素格；完整地图包含后续章节地区，当前可玩内容为序章和第一章。</footer>
<script>
(async()=>{const world=await(await fetch('../data/formal_world.json?v=0.1.3')).json();const atlas=new Image();atlas.src='../assets/world_tiles/world-tiles.png';await atlas.decode();const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let selected=null;
const nature=await(await fetch('../assets/nature/nature.json')).json(),textures=new Map();
await Promise.all(nature.sprites.map(async sprite=>{const img=new Image();img.src='../'+sprite.path.replace('res://','');await img.decode();textures.set(sprite.key,img)}));
const nodes=Object.values(world.nodes),buttons=new Map();
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const layer of world.layers)for(let y=0;y<world.height;y++)for(let x=0;x<world.width;x++){const id=layer[y][x];if(id!==null&&id>=0)ctx.drawImage(atlas,id%32*16,Math.floor(id/32)*16,16,16,x*16,y*16,16,16)}for(const prop of world.natural_props||[]){const img=textures.get(prop.key);ctx.save();ctx.translate(prop.position[0],prop.position[1]);const size=prop.size||[img.width,img.height];if(prop.flip){ctx.translate(size[0],0);ctx.scale(-1,1)}ctx.drawImage(img,0,0,size[0],size[1]);ctx.restore()}if(selected){ctx.save();ctx.shadowColor='#f0e6ad';ctx.shadowBlur=12;ctx.fillStyle='#ede3b746';ctx.beginPath();ctx.arc(selected.x*16+8,selected.y*16+8,15,0,Math.PI*2);ctx.fill();ctx.restore()}}
function choose(n){selected=n;for(const [id,b]of buttons)b.classList.toggle('active',id===n.id);const d=document.querySelector('#detail');d.replaceChildren();const h=document.createElement('h2');h.textContent=n.name;d.append(h);const p=document.createElement('p');p.textContent=`${n.id} · ${n.kind} · 开放章 ${n.chapter} · (${n.x},${n.y})`;d.append(p);for(const r of world.routes.filter(r=>r.a===n.id||r.b===n.id)){const other=nodes.find(z=>z.id===(r.a===n.id?r.b:r.a));const item=document.createElement('p');item.textContent=`↔ ${other.name}：${r.mode}。${r.gate}`;d.append(item)}draw()}
for(const n of nodes){const b=document.createElement('button');b.textContent=`${n.id}　${n.name}`;b.onclick=()=>choose(n);buttons.set(n.id,b);document.querySelector('#nodes').append(b)}canvas.onclick=e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width/16,y=(e.clientY-rect.top)*canvas.height/rect.height/16;const closest=nodes.reduce((a,n)=>Math.hypot(n.x+.5-x,n.y+.5-y)<Math.hypot(a.x+.5-x,a.y+.5-y)?n:a);if(Math.hypot(closest.x+.5-x,closest.y+.5-y)<2)choose(closest)};choose(nodes[0]);})().catch(e=>document.querySelector('#detail').textContent='加载失败：'+e.message);
</script></html>
