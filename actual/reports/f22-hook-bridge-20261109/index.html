<title>F22 押送舰救援 · 船尾钩索演出</title>
<style>
:root{color-scheme:dark;--ink:#edf1f2;--muted:#acb8c2;--edge:#344352;--accent:#a6e0d0;--gold:#eec588}
*{box-sizing:border-box}
body{margin:0;background:#0e1620;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}
main{max-width:1120px;margin:auto;padding:32px clamp(14px,4vw,42px)}
header{margin-bottom:19px}
.eyebrow{margin:0 0 3px;color:var(--gold);letter-spacing:.12em;font-size:12px;font-weight:700}
h1{margin:0;font-size:clamp(22px,4.4vw,41px);line-height:1.23;letter-spacing:.03em;text-wrap:balance}
.title-piece{white-space:nowrap}
header p:last-child{margin:8px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:16px;align-items:start}
figure,.side{min-width:0;margin:0;background:#16212d;border:1px solid var(--edge);border-radius:13px;overflow:hidden}
.toolbar,.player{padding:10px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.map{position:relative;background:#0c1520;isolation:isolate}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.mark{position:absolute;translate:-50% -50%;display:grid;place-items:center;width:23px;height:23px;border-radius:50%;border:1px solid #16212d;background:var(--gold);color:#211b16;font:800 13px/1 system-ui;box-shadow:0 0 0 1px #ddbf9c85,0 2px 5px #0009;pointer-events:none}
.mark[hidden]{display:none}
button{border:0;border-radius:7px;min-height:40px;padding:8px 13px;background:#263648;color:#eff5f7;font:inherit;font-size:14px;font-weight:600;line-height:1.3;text-align:center;cursor:pointer}
button:hover{background:#334a60}
button[aria-pressed=true]{background:#374b5d;color:#ffdfac}
button:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 4px #9ac9e55c}
button:disabled{opacity:.45;cursor:default}
#play{min-width:92px;background:#b5e4d6;color:#112921;font-weight:750}
#play:hover{background:#cdf6e9}
.control{display:flex;align-items:center;gap:10px;padding:0 14px 11px}
input[type=range]{min-width:0;width:100%;accent-color:var(--accent);margin:0}
output{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
figcaption{min-height:61px;padding:9px 13px 12px;background:#101b27;text-align:center;color:var(--muted);overflow-wrap:anywhere}
figcaption strong{display:block;color:var(--accent);font-size:15px}
.side{padding:15px}
.side h2{font-size:16px;margin:0 0 11px}
.side ol{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:block;width:100%;text-align:left;padding:10px 11px;background:#1e2d3c;color:var(--ink);line-height:1.45}
.step b{display:block;font-size:14px}
.step small{display:block;font-weight:400;font-size:13px;color:#bcc9d3;margin-top:4px}
.key{display:grid;gap:6px;color:var(--muted);margin-top:14px;font-size:13px}
.key span{display:flex;align-items:center;gap:7px}
.key i{display:grid;place-items:center;width:17px;height:17px;flex:0 0 17px;font-style:normal;font-size:11px;font-weight:750;background:var(--gold);color:#211b16;border-radius:50%}
.note{border-top:1px solid var(--edge);padding-top:11px;margin:12px 0 0;color:var(--muted);font-size:13px}
@media(max-width:760px){main{padding-top:18px}.grid{grid-template-columns:minmax(0,1fr)}.side ol{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){.toolbar,.player{gap:5px}button{padding-inline:8px}.toolbar button{font-size:13px}}
</style>
<main>
<header>
  <p class="eyebrow">REVENGE MEMORIES　／　战场演出</p>
  <h1>F22 押送舰救援<span class="title-piece"> · 船尾钩索</span></h1>
  <p>艾琳烧断发射架上的束绳。钩头飞过水面，扣住备用梯的上端，把梯子拉到两艘船之间。</p>
</header>
<div class="grid">
<figure>
  <div class="toolbar" role="group" aria-label="地图视图">
    <button id="close" aria-pressed="true">船尾特写</button>
    <button id="wide" aria-pressed="false">全地图</button>
    <button id="range" aria-pressed="false">箭台射程</button>
    <button id="marks" aria-pressed="true">位置标记</button>
  </div>
  <div class="map">
    <canvas id="scene" width="304" height="154" aria-label="F22 两艘船与钩索的逐帧实机画面"></canvas>
    <span class="mark" data-x="189" data-y="374">1</span>
    <span class="mark" data-x="282" data-y="312" data-open-x="228" data-open-y="344">2</span>
    <span class="mark" data-x="361" data-y="300">3</span>
  </div>
  <div class="player" role="group" aria-label="动画播放">
    <button id="play" disabled>播放</button>
    <button id="prev" disabled>上一帧</button>
    <button id="next" disabled>下一帧</button>
  </div>
  <label class="control" for="scrub"><input id="scrub" type="range" min="0" max="13" value="0" step="1" aria-label="动画帧" disabled><output id="count" for="scrub">01 / 14</output></label>
  <figcaption><strong id="phase">准备</strong><span id="detail">艾琳走到己方船尾，对钩索发射架施放焰环。</span></figcaption>
</figure>
<aside class="side">
  <h2>分步查看</h2>
  <ol>
    <li><button class="step" data-frame="1"><b>01　束绳烧断</b><small>发射架上的束绳被烧断。</small></button></li>
    <li><button class="step" data-frame="4"><b>02　钩头飞出</b><small>发射架把钩头弹出去，绳索跟着放出。</small></button></li>
    <li><button class="step" data-frame="7"><b>03　绳索拉紧</b><small>钩头扣住横档，开始把梯子往己方拉。</small></button></li>
    <li><button class="step" data-frame="13"><b>04　梯子铺平</b><small>梯脚固定在敌舰船沿，另一端落在己方船沿。</small></button></li>
  </ol>
  <div class="key" aria-label="位置标记">
    <span><i>1</i>己方发射架</span>
    <span><i>2</i>靠在敌舰船沿的备用梯</span>
    <span><i>3</i>移到右上方的楼梯</span>
  </div>
  <p class="note">打开箭台射程可看到红色覆盖格。备用梯铺好后，下方五格均可通行，也都在固定箭台的射程外。</p>
</aside>
</div>
</main>

const end=1.87;

const closeView=[110,260,300,153];
const wideView=[0,0,544,448];
const text=[
 ['准备','艾琳走到己方船尾，对钩索发射架施放焰环。'],
 ['束绳烧断','焰环击中发射架，束绳燃起。'],
 ['束绳烧断','束绳断开，发射架弹开。'],
 ['钩头飞出','钩头离开发射架，拽出绳索。'],
 ['钩头飞出','钩头飞过两船之间的水面。'],
 ['钩头飞出','钩头接近梯子上端的横档。'],
 ['绳索拉紧','钩头扣住横档。'],
 ['绳索拉紧','绳索拉直，梯子上端开始向己方船移动。'],
 ['梯子翻倒','梯脚固定在敌舰船沿，梯子绕着梯脚向下转。'],
 ['梯子翻倒','绳索继续牵住上端，梯子横过海面。'],
 ['梯子翻倒','梯子向己方船沿靠近。'],
 ['梯子翻倒','梯子的上端即将落到己方船沿。'],
 ['梯子落下','梯子落在己方船沿，接通两艘船。'],
 ['梯子铺平','五格海面变为通路，可以从船尾登舰。']
];
const $=id=>document.getElementById(id);
const canvas=$('scene');
const context=canvas.getContext('2d',{alpha:false});
const marks=[...document.querySelectorAll('.mark')];
const steps=[...document.querySelectorAll('.step')];
let frame=0, playing=false, wide=false, range=false, tagged=true, start=0, request=0, loaded=false;
const images=assets.map(data=>{
  const image=new Image();
  image.src='data:image/webp;base64,'+data;
  return image;
});
function draw(){
  if(!loaded)return;
  const [x,y,w,h]=wide?wideView:closeView;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  context.imageSmoothingEnabled=false;
  context.drawImage(images[0],-x,-y);
  if(frame>0)context.drawImage(images[frame],patch[0]-x,patch[1]-y);
  if(range){
    context.fillStyle='rgba(213,75,83,.30)';
    for(const [tx,ty] of threats)context.fillRect(tx*16-x,ty*16-y,16,16);
    if(frame>=12){
      context.fillStyle='rgba(123,230,197,.34)';
      for(let tx=11;tx<=15;tx++)context.fillRect(tx*16-x+1,22*16-y+1,14,14);
    }
  }
  for(const mark of marks){
    const placed=frame>=12&&mark.dataset.openX;
    const mx=Number(placed?mark.dataset.openX:mark.dataset.x)-x;
    const my=Number(placed?mark.dataset.openY:mark.dataset.y)-y;
    mark.hidden=!tagged||playing||(mark.dataset.openX&&frame>=8&&frame<12)||mx<13||my<13||mx>w-13||my>h-13;
    mark.style.left=(100*mx/w)+'%';
    mark.style.top=(100*my/h)+'%';
  }
  $('scrub').value=frame;
  $('count').value=String(frame+1).padStart(2,'0')+' / '+text.length;
  $('phase').textContent=text[frame][0];
  $('detail').textContent=text[frame][1];
  $('prev').disabled=frame===0;
  $('next').disabled=frame===13;
  $('play').textContent=playing?'暂停':frame===13?'重播':frame===0?'播放':'继续';
  for(const [id,active] of [['close',!wide],['wide',wide],['range',range],['marks',tagged]])
    $(id).setAttribute('aria-pressed',String(active));
  const phase=frame===0?-1:frame<3?0:frame<6?1:frame<12?2:3;
  steps.forEach((button,index)=>button.setAttribute('aria-pressed',String(index===phase)));
}
function stop(){playing=false;cancelAnimationFrame(request);}
function seek(index){stop();frame=Math.min(13,Math.max(index,0));draw();}
function tick(now){
  const elapsed=(now-start)/1000;
  if(elapsed>=end){seek(13);return;}
  while(frame<13&&elapsed>=starts[frame+1])frame++;
  draw();
  request=requestAnimationFrame(tick);
}
$('play').onclick=()=>{
  if(playing){stop();draw();return;}
  if(frame===13)frame=0;
  start=performance.now()-starts[frame]*1000;
  playing=true;draw();
  request=requestAnimationFrame(tick);
};
$('prev').onclick=()=>seek(frame-1);
$('next').onclick=()=>seek(frame+1);
$('scrub').oninput=event=>seek(Number(event.target.value));
$('close').onclick=()=>{wide=false;draw();};
$('wide').onclick=()=>{wide=true;draw();};
$('range').onclick=()=>{range=!range;if(range)wide=true;draw();};
$('marks').onclick=()=>{tagged=!tagged;draw();};
steps.forEach(button=>button.onclick=()=>seek(Number(button.dataset.frame)));
Promise.all(images.map(image=>image.decode())).then(()=>{
  loaded=true;$('play').disabled=false;$('scrub').disabled=false;draw();
}).catch(()=>{$('phase').textContent='预览画面加载失败';});
</script>
