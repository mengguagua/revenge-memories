<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二章 · 第二轮实机视觉夹具</title><style>body{margin:0;background:#142127;color:#ece8d8;font:16px/1.7 system-ui;padding:36px}h1{margin:0 0 12px}p{max-width:900px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:24px}figure{margin:0;padding:16px;background:#25373c;border-radius:16px}img{width:100%;height:auto;image-rendering:pixelated}small{color:#becac4}a{color:#dbe2cc}figcaption{padding-top:12px}</style><h1>第二章 · 第二轮实机视觉夹具</h1><p>所有图片由 Godot 实际视口后台渲染，36 个定向视觉夹具，覆盖八场地图、目标、单位卡、动态桥面、囚门、灯塔与事件船。开局队伍和目标状态被明确安排以便检查，不能视为自然通关或玩家试玩成绩。所有窗口保持后台，不激活、不抢焦点。</p><p>运行检查：36 张截图的布局错误为 0。目标文案已通过确认键完整展开后检查，三倍副本使用最近邻放大。</p><div class="grid" id="shots"></div><script>fetch('captures.json').then(r=>r.json()).then(d=>{for(const s of d.shots){const fn=s.path.split('/').pop(),f=document.createElement('figure'),a=document.createElement('a'),im=document.createElement('img'),c=document.createElement('figcaption');a.href=s.preview3x||fn;im.src=fn;im.alt=fn;a.append(im);c.textContent=fn+' · 视觉夹具';f.append(a,c);document.querySelector('#shots').append(f);}});</script></html>
