<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H21 · 马丁交互演示</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #111820;
      --surface: #222d39;
      --ink: #f1ede3;
      --muted: #bac5d0;
      --gold: #edd298;
      font: 16px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); }
    main { width: min(100% - 36px, 512px); margin: 0 auto; padding: 28px 0 32px; }
    header { margin-bottom: 16px; }
    .location { margin: 0 0 4px; color: var(--gold); font-size: .86rem; }
    h1 { margin: 0; font-size: clamp(1.5rem, 5.8vw, 2rem); line-height: 1.25; }
    figure { margin: 0; }
    .stage {
      position: relative;
      aspect-ratio: 256 / 240;
      overflow: hidden;
      border-radius: 8px;
      background: #14222c;
      box-shadow: 0 8px 28px #06090d66, 0 0 0 1px #a8b1bb2b;
    }
    .stage img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    button { border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 5px #e6c47c46, 0 0 15px #e6c47c66;
    }
    button:disabled { cursor: default; opacity: .58; }
    .hit { position: absolute; background: transparent; padding: 0; }
    .hit[hidden] { display: none; }
    .hit.next { inset: 0; width: 100%; }
    .hit.next:focus-visible { box-shadow: inset 0 0 24px #e6c47c78; }
    .hit.martin {
      left: var(--actor-x); top: var(--actor-y);
      width: 11%; height: 13%;
      transform: translate(-50%, -50%);
    }
    .hit.martin:hover, .hit.martin:focus-visible {
      background: #ffd88f16;
      box-shadow: 0 0 18px #ffdb9266;
    }
    figcaption { padding: 13px 0 15px; min-height: 77px; }
    #phase { color: var(--gold); font-weight: 650; }
    #hint { display: block; color: var(--muted); font-size: .94rem; margin-top: 3px; }
    .controls { display: flex; flex-wrap: wrap; gap: 9px; }
    .controls button { padding: 10px 16px; min-height: 44px; }
    #primary { background: var(--gold); color: #241e16; font-weight: 650; }
    #primary:hover:not(:disabled) { background: #ffe3a7; }
    #reset { background: var(--surface); color: var(--ink); }
    #reset:hover:not(:disabled) { background: #304051; }
    .keys { color: var(--muted); font-size: .8rem; margin: 12px 0 0; }
    .sr {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="location">H21 · 风灯岛船坞</p>
      <h1>马丁交互演示</h1>
    </header>
    <figure>
      <div class="stage" id="stage">
        <img id="game" width="256" height="240" alt="H21 实机画面">
        <button class="hit next" id="next-hit" aria-label="继续对白" hidden></button>
        <button class="hit martin" id="martin-hit" aria-label="与马丁再次交谈" hidden></button>
      </div>
      <figcaption>
        <span id="phase"></span>
        <span id="hint"></span>
      </figcaption>
    </figure>
    <div class="controls">
      <button type="button" id="primary">播放首次交谈</button>
      <button type="button" id="reset">重播</button>
    </div>
    <p class="keys">键盘 Z 或空格继续，R 重播。画面取自实机。</p>
    <p class="sr" id="announcement" aria-live="polite" aria-atomic="true"></p>
    <noscript>启用 JavaScript 即可逐步查看演示。</noscript>

  <script>
    const data = JSON.parse(document.getElementById("frames").textContent);
    const stage = document.getElementById("stage");
    const game = document.getElementById("game");
    const phase = document.getElementById("phase");
    const hint = document.getElementById("hint");
    const primary = document.getElementById("primary");
    const reset = document.getElementById("reset");
    const nextHit = document.getElementById("next-hit");
    const martinHit = document.getElementById("martin-hit");
    const announcement = document.getElementById("announcement");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const [actorX, actorY] = data.martin;
    const [frameWidth, frameHeight] = data.native;
    stage.style.setProperty("--actor-x", (actorX / frameWidth * 100) + "%");
    stage.style.setProperty("--actor-y", (actorY / frameHeight * 100) + "%");

    const preloaded = Object.fromEntries(Object.entries(data.images).map(([name, source]) => {
      const frame = new Image();
      frame.src = source;
      return [name, frame];
    }));

    let state = "dock";
    let page = 0;
    let walkTimer = 0;

    function picture(name, description) {
      game.src = preloaded[name].src;
      game.alt = description;
    }

    function show(stateName, title, detail, buttonText) {
      state = stateName;
      stage.dataset.state = stateName;
      phase.textContent = title;
      hint.textContent = detail;
      primary.textContent = buttonText;
      primary.disabled = stateName === "walk";
      reset.disabled = stateName === "dock";
      nextHit.hidden = stateName !== "talk" && stateName !== "repeat";
      martinHit.hidden = stateName !== "ready";
    }

    function dock() {
      clearTimeout(walkTimer);
      page = 0;
      picture("dock", "风灯岛船坞。村民形象的马丁站在南边跳板左侧。");
      show("dock", "船坞站位", "跳板左边是马丁。播放从卡洛谈完后接起。", "播放首次交谈");
      announcement.textContent = "跳板左边是马丁。";
    }

    function dialogue(repeat = false) {
      const pages = repeat ? data.repeat : data.talk;
      const line = pages[page];
      const speech = line.speaker + "：" + line.text;
      picture(line.image, speech);
      const last = page === pages.length - 1;
      const title = repeat ? "再次交谈" : "首次交谈 · " + (page + 1) + " / " + pages.length;
      const detail = !repeat && last ? "这句结束后，开放出航。" : "点击对白画面继续。";
      show(repeat ? "repeat" : "talk", title, detail, last ? "结束交谈" : "下一句");
      announcement.textContent = speech;
    }

    function start() {
      page = 0;
      if (reducedMotion.matches) {
        dialogue();
        return;
      }
      show("walk", "走向马丁", "艾琳走到马丁面前，随后自动开始交谈。", "走位中");
      announcement.textContent = "艾琳正在走向马丁。";
      let frame = 0;
      function step() {
        if (frame === data.walk.length) {
          dialogue();
          return;
        }
        picture(data.walk[frame], "艾琳沿船坞走向马丁。");
        frame += 1;
        walkTimer = setTimeout(step, 90);
      }
      step();
    }

    function ready() {
      page = 0;
      picture("ready", "艾琳面向马丁，实机提示「确认：马丁」。");
      show("ready", "出航已开放", "点击跳板左侧的马丁，试一次再次交谈。", "再次交谈");
      announcement.textContent = "出航已开放。可以再次和马丁交谈。";
    }

    function proceed() {
      if (state === "dock") {
        start();
      } else if (state === "talk") {
        page += 1;
        if (page < data.talk.length) dialogue();
        else ready();
      } else if (state === "ready") {
        page = 0;
        dialogue(true);
      } else if (state === "repeat") {
        page += 1;
        if (page < data.repeat.length) dialogue(true);
        else ready();
      }
    }

    primary.addEventListener("click", proceed);
    nextHit.addEventListener("click", proceed);
    martinHit.addEventListener("click", proceed);
    reset.addEventListener("click", dock);
    document.addEventListener("keydown", event => {
      if (event.repeat || event.altKey || event.metaKey || event.ctrlKey) return;
      if (event.key.toLowerCase() === "r") {
        dock();
        return;
      }
      const space = event.code === "Space";
      if (space && event.target instanceof HTMLButtonElement) return;
      if (space || event.key.toLowerCase() === "z") {
        event.preventDefault();
        proceed();
      }
    });

    dock();
  </script>
</body>
</html>
